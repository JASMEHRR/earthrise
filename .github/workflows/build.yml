name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test lyric helpers
        run: node --test tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          else
            echo "::warning::No signing key secret set. Using a throwaway debug key, so this APK cannot update an earlier install."
          fi
          if [ -z "$SPOTIFY_CLIENT_ID" ]; then
            echo "::warning::SPOTIFY_CLIENT_ID variable not set. Enter the Client ID in the app's Settings instead."
          fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk earthrise-visualizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: earthrise-visualizer-apk
          path: earthrise-visualizer.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" earthrise-visualizer.apk \
            --title "Earthrise build ${{ github.run_number }}" \
            --notes "APK built from ${{ github.sha }}. Install on Android TV or a phone." \
            --latest
